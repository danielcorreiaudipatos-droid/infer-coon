version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: onnews-db
    environment:
      POSTGRES_USER: onnews_user
      POSTGRES_PASSWORD: onnews_password_change_me
      POSTGRES_DB: onnews_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas/onnews.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/schemas/onnews-v2-cep-cnpj.sql:/docker-entrypoint-initdb.d/02-cep-cnpj.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onnews_user -d onnews_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: ./api-onnews
      dockerfile: Dockerfile
    container_name: onnews-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://onnews_user:onnews_password_change_me@db:5432/onnews_db
      JWT_SECRET: dev-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      CEP_API_PROVIDER: viacep
      BRASIL_IO_API_KEY: ${BRASIL_IO_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api-onnews/src:/app/src
      - ./api-onnews/node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin (Database UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: onnews-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@onnews.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
