<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integração Site — on.imob</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 2rem; color: #333; }
        .card { background: white; border-radius: 8px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
        button { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .status { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .status-ok { background: #dcfce7; color: #166534; }
        .status-erro { background: #fee2e2; color: #991b1b; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        th { background: #f9f9f9; font-weight: 600; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-pendente { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Integração com Site Externo</h1>

        <!-- Config -->
        <div class="card">
            <h2 style="margin-bottom: 1rem;">⚙️ Configuração</h2>
            <div id="statusConfig"></div>

            <form id="formConfig" style="display: none;">
                <div class="form-group">
                    <label>URL do Site</label>
                    <input type="url" id="urlSite" placeholder="https://vitrine.imovel.com.br" required>
                </div>
                <div class="form-group">
                    <label>API Key (chave de autenticação)</label>
                    <input type="password" id="apiKey" placeholder="sk_..." required>
                </div>
                <button type="button" class="btn-primary" onclick="salvarConfig()">💾 Salvar Configuração</button>
            </form>

            <button class="btn-primary" id="btnAlterar" style="display: none;" onclick="alterarConfig()">✏️ Alterar Configuração</button>
        </div>

        <!-- Publicar Imóvel -->
        <div class="card">
            <h2 style="margin-bottom: 1rem;">📤 Publicar Imóvel</h2>
            <div class="form-group">
                <label>Selecione o imóvel</label>
                <select id="selecimovel" onchange="verificarStatus()">
                    <option value="">Carregando...</option>
                </select>
            </div>
            <div id="statusPublicacao"></div>
            <button class="btn-primary" onclick="publicarImovel()" id="btnPublicar" style="display: none;">🚀 Publicar no Site</button>
        </div>

        <!-- Histórico -->
        <div class="card">
            <h2 style="margin-bottom: 1rem;">📋 Histórico de Publicações</h2>
            <table id="tabelaPublicacoes">
                <thead>
                    <tr>
                        <th>Imóvel</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Link</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" style="text-align: center; color: #999;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tokenAuth = localStorage.getItem('coon_auth_token') || localStorage.getItem('coon_master_key') || '';

        async function carregarConfig() {
            try {
                const r = await fetch('/api/admin/integracao-site/config', {
                    headers: { 'Authorization': 'Bearer ' + tokenAuth }
                });
                const config = await r.json();

                if (config.url_site) {
                    document.getElementById('statusConfig').innerHTML = `<div class="status status-ok">✓ Site: ${config.url_site}</div>`;
                    document.getElementById('formConfig').style.display = 'none';
                    document.getElementById('btnAlterar').style.display = 'block';
                    carregarImoveis();
                } else {
                    document.getElementById('statusConfig').innerHTML = '<p style="color: #666;">Nenhuma configuração salva. Configure o site para começar.</p>';
                    document.getElementById('formConfig').style.display = 'block';
                    document.getElementById('btnAlterar').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('statusConfig').innerHTML = `<div class="status status-erro">Erro: ${e.message}</div>`;
            }
        }

        function alterarConfig() {
            document.getElementById('formConfig').style.display = 'block';
            document.getElementById('btnAlterar').style.display = 'none';
        }

        async function salvarConfig() {
            const url = document.getElementById('urlSite').value;
            const key = document.getElementById('apiKey').value;

            if (!url || !key) {
                alert('Preencha URL e API Key.');
                return;
            }

            const fd = new FormData();
            fd.append('url_site', url);
            fd.append('api_key', key);

            try {
                const r = await fetch('/api/admin/integracao-site/config', {
                    method: 'POST',
                    body: fd,
                    headers: { 'Authorization': 'Bearer ' + tokenAuth }
                });
                const res = await r.json();
                alert(res.msg || 'Configurado!');
                carregarConfig();
            } catch (e) {
                alert('Erro: ' + e.message);
            }
        }

        async function carregarImoveis() {
            try {
                const r = await fetch('/api/onimob/imoveis', {
                    headers: { 'Authorization': 'Bearer ' + tokenAuth }
                });
                const data = await r.json();
                const imoveis = data.imoveis || [];

                let html = '<option value="">Escolha um imóvel...</option>';
                for (const im of imoveis) {
                    html += `<option value="${im.id}">${im.titulo}</option>`;
                }
                document.getElementById('selecimovel').innerHTML = html;
            } catch (e) {
                alert('Erro ao carregar imóveis: ' + e.message);
            }
        }

        async function verificarStatus() {
            const imovelId = document.getElementById('selecimovel').value;
            if (!imovelId) {
                document.getElementById('statusPublicacao').innerHTML = '';
                document.getElementById('btnPublicar').style.display = 'none';
                return;
            }

            try {
                const r = await fetch(`/api/onimob/imoveis/${imovelId}/publicacao-status`, {
                    headers: { 'Authorization': 'Bearer ' + tokenAuth }
                });
                const status = await r.json();

                if (status.status === 'publicado') {
                    document.getElementById('statusPublicacao').innerHTML = `<div class="status status-ok">✓ Publicado em ${new Date(status.publicado_em * 1000).toLocaleDateString()}</div>`;
                    document.getElementById('btnPublicar').style.display = 'none';
                } else {
                    document.getElementById('statusPublicacao').innerHTML = '<div class="status status-pendente">⏳ Não publicado ainda</div>';
                    document.getElementById('btnPublicar').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('statusPublicacao').innerHTML = `<div class="status status-erro">Erro: ${e.message}</div>`;
            }
        }

        async function publicarImovel() {
            const imovelId = document.getElementById('selecimovel').value;
            if (!imovelId) {
                alert('Escolha um imóvel.');
                return;
            }

            try {
                const fd = new FormData();
                const r = await fetch(`/api/onimob/imoveis/${imovelId}/publicar-site`, {
                    method: 'POST',
                    body: fd,
                    headers: { 'Authorization': 'Bearer ' + tokenAuth }
                });
                const res = await r.json();

                if (res.erro) {
                    alert('Erro: ' + res.erro);
                } else {
                    alert('✓ ' + res.msg + '\n\nURL: ' + (res.url || ''));
                    verificarStatus();
                }
            } catch (e) {
                alert('Erro: ' + e.message);
            }
        }

        carregarConfig();
    </script>
</body>
</html>
