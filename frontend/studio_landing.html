<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coon Studio | Criação de Marketing Imobiliário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    };
    if (localStorage.getItem('coon_theme') === 'dark' || (!('coon_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    .glass-nav {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    .dark .glass-nav {
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 selection:bg-purple-500/30 font-sans min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="window.location.href='/'">
          <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-fuchsia-600 rounded-lg flex items-center justify-center shadow-lg shadow-purple-500/20">
            <i data-lucide="palette" class="w-5 h-5 text-white"></i>
          </div>
          <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">coon<span class="text-purple-500">.</span></span>
        </div>
        <div class="hidden md:flex space-x-8 items-center">
          <a href="/infer" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-purple-500 transition">Inferência</a>
          <a href="/growth" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-purple-500 transition">Growth</a>
          <a href="/chat" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-purple-500 transition">Chat</a>
          <a href="/studio" class="text-sm font-medium text-purple-600 dark:text-purple-400 border-b-2 border-purple-500 pb-1 transition">Studio</a>
          
          <div class="h-4 w-px bg-slate-200 dark:bg-slate-700"></div>
          
          <button onclick="toggleCoonTheme()" id="themeIconSlot" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300"></button>
          <a href="/login" class="text-sm font-semibold bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-5 py-2 rounded-full shadow-lg shadow-slate-900/20 hover:scale-105 transition-transform">Entrar</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <main class="flex-grow flex items-center justify-center pt-20">
    <div class="text-center px-4">
      <div class="inline-block p-4 bg-purple-100 dark:bg-purple-900/30 rounded-2xl mb-6">
        <i data-lucide="aperture" class="w-12 h-12 text-purple-600 dark:text-purple-400"></i>
      </div>
      <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-slate-900 dark:text-white">Coon Studio</h1>
      <p class="text-lg text-slate-600 dark:text-slate-400 max-w-xl mx-auto mb-8">
        Geração de imagens de alto padrão, vídeos automáticos para vitrines de imóveis e edição visual por IA em segundos.
      </p>
      <div class="flex items-center justify-center space-x-4">
        <span class="px-4 py-2 bg-slate-200 dark:bg-slate-800 rounded-lg text-sm font-medium">Em breve no ecossistema Coon</span>
      </div>
    </div>
  </main>

  <footer class="bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12">
    <div class="text-center text-slate-500 dark:text-slate-400 text-sm">© 2026 Coon Participações.</div>
  </footer>

  <script>
    lucide.createIcons();
    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const slot = document.getElementById('themeIconSlot');
      if (!slot) return;
      slot.innerHTML = isDark ? `<i data-lucide="sun" class="w-5 h-5 text-amber-300"></i>` : `<i data-lucide="moon" class="w-5 h-5 text-slate-600"></i>`;
      lucide.createIcons();
    }
    window.toggleCoonTheme = function() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('coon_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      updateThemeIcons();
    };
    updateThemeIcons();
  </script>
</body>
</html>
