<!-- 🤖 IA Assistant Bar — Insira em qualquer página -->
<style>
    .ia-assistant-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .ia-button-open {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
        color: white;
        border: none;
        cursor: pointer;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
    }

    .ia-button-open:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(0, 102, 204, 0.5);
    }

    .ia-button-open.hidden {
        display: none;
    }

    .ia-panel {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 380px;
        height: 500px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: slideUp 0.3s ease-out;
        display: none;
    }

    .ia-panel.open {
        display: flex;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .ia-header {
        background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
        color: white;
        padding: 16px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ia-close {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 0;
        width: 24px;
        height: 24px;
    }

    .ia-context {
        background: #f0f4f9;
        padding: 12px;
        font-size: 12px;
        color: #333;
        line-height: 1.6;
        border-bottom: 1px solid #ddd;
    }

    .ia-context-item {
        margin: 4px 0;
    }

    .ia-context-label {
        font-weight: 600;
        color: #666;
    }

    .ia-chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        background: white;
    }

    .ia-message {
        margin-bottom: 12px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
    }

    .ia-message.user {
        background: #0066cc;
        color: white;
        margin-left: 20px;
        text-align: right;
    }

    .ia-message.assistant {
        background: #f0f0f0;
        color: #333;
        margin-right: 20px;
    }

    .ia-typing {
        display: flex;
        gap: 4px;
        padding: 10px;
        color: #999;
    }

    .ia-typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #999;
        animation: pulse 1.4s infinite;
    }

    .ia-typing span:nth-child(1) { animation-delay: 0s; }
    .ia-typing span:nth-child(2) { animation-delay: 0.2s; }
    .ia-typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
    }

    .ia-suggestions {
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        border-top: 1px solid #eee;
    }

    .ia-suggestion-btn {
        padding: 6px 12px;
        background: #f0f0f0;
        border: 1px solid #ddd;
        border-radius: 16px;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s;
        color: #333;
    }

    .ia-suggestion-btn:hover {
        background: #e0e0e0;
    }

    .ia-input-area {
        padding: 12px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 8px;
    }

    .ia-input {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 20px;
        padding: 8px 12px;
        font-size: 13px;
        outline: none;
    }

    .ia-input:focus {
        border-color: #0066cc;
        box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
    }

    .ia-send-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #0066cc;
        color: white;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        transition: all 0.2s;
    }

    .ia-send-btn:hover {
        background: #0052a3;
    }

    .ia-action-banner {
        background: #fffbea;
        border-left: 4px solid #ffc107;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 4px;
        font-size: 12px;
        color: #333;
    }

    .ia-action-banner button {
        background: #ffc107;
        color: #333;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 6px;
        font-size: 11px;
        font-weight: 600;
    }

    .ia-action-banner button:hover {
        background: #ffb300;
    }
</style>

<div class="ia-assistant-container">
    <!-- Botão Flutuante -->
    <button class="ia-button-open" id="iaOpenBtn" onclick="abrirAssistente()">🤖</button>

    <!-- Painel Chat -->
    <div class="ia-panel" id="iaPanel">
        <div class="ia-header">
            <span>🤖 Assistente on.imob</span>
            <button class="ia-close" onclick="fecharAssistente()">✕</button>
        </div>

        <div class="ia-context" id="iaContext">
            <div class="ia-context-item">
                <span class="ia-context-label">📍 Carregando contexto...</span>
            </div>
        </div>

        <!-- Chat -->
        <div class="ia-chat-area" id="iaChatArea"></div>

        <!-- Sugestões -->
        <div class="ia-suggestions" id="iaSuggestions"></div>

        <!-- Input -->
        <div class="ia-input-area">
            <input
                type="text"
                class="ia-input"
                id="iaInput"
                placeholder="Sua dúvida aqui..."
                onkeypress="if(event.key=='Enter') enviarPergunta()">
            <button class="ia-send-btn" onclick="enviarPergunta()">➤</button>
        </div>
    </div>
</div>

<script>
    // Estado do chat
    const chatState = {
        aberto: false,
        pagina: detectarPagina(),
        contexto: {},
        historico: []
    };

    // Detectar página atual
    function detectarPagina() {
        const url = window.location.pathname;
        if (url.includes('dashboard')) return 'dashboard_financeiro';
        if (url.includes('portal-proprietario')) return 'portal_proprietario';
        if (url.includes('portal-inquilino')) return 'portal_inquilino';
        if (url.includes('modelos')) return 'modelos_cartas';
        if (url.includes('garantias')) return 'dashboard_garantias';
        return 'dashboard_financeiro';
    }

    // Obter contexto da página
    function obterContextoPagina() {
        const ctx = {};

        // Tentar extrair dados visíveis na página
        const nomeImovel = document.querySelector('[data-imovel-nome]')?.textContent;
        const nomeInquilino = document.querySelector('[data-inquilino-nome]')?.textContent;
        const diasAtraso = document.querySelector('[data-dias-atraso]')?.textContent;
        const valorAluguel = document.querySelector('[data-valor-aluguel]')?.textContent;

        if (nomeImovel) ctx.imovel_nome = nomeImovel;
        if (nomeInquilino) ctx.inquilino_nome = nomeInquilino;
        if (diasAtraso) ctx.dias_atraso = parseInt(diasAtraso);
        if (valorAluguel) ctx.valor_aluguel = valorAluguel;

        return ctx;
    }

    // Atualizar contexto no painel
    function atualizarContextoUI() {
        chatState.contexto = obterContextoPagina();
        const contextDiv = document.getElementById('iaContext');
        let html = `<div class="ia-context-item"><span class="ia-context-label">📍 ${chatState.pagina}</span></div>`;

        if (chatState.contexto.imovel_nome) {
            html += `<div class="ia-context-item">🏠 ${chatState.contexto.imovel_nome}</div>`;
        }
        if (chatState.contexto.inquilino_nome) {
            html += `<div class="ia-context-item">👤 ${chatState.contexto.inquilino_nome}</div>`;
        }
        if (chatState.contexto.dias_atraso) {
            html += `<div class="ia-context-item" style="color: #dc3545;">⏰ ${chatState.contexto.dias_atraso} dias atrasado</div>`;
        }

        contextDiv.innerHTML = html;
    }

    // Abrir/Fechar painel
    function abrirAssistente() {
        chatState.aberto = true;
        document.getElementById('iaPanel').classList.add('open');
        document.getElementById('iaOpenBtn').classList.add('hidden');
        atualizarContextoUI();
        document.getElementById('iaInput').focus();
    }

    function fecharAssistente() {
        chatState.aberto = false;
        document.getElementById('iaPanel').classList.remove('open');
        document.getElementById('iaOpenBtn').classList.remove('hidden');
    }

    // Enviar pergunta
    async function enviarPergunta() {
        const input = document.getElementById('iaInput');
        const pergunta = input.value.trim();

        if (!pergunta) return;

        // Adicionar mensagem do usuário
        adicionarMensagem(pergunta, 'user');
        input.value = '';

        // Mostrar indicador de digitação
        const chatArea = document.getElementById('iaChatArea');
        const typingDiv = document.createElement('div');
        typingDiv.className = 'ia-typing';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        typingDiv.id = 'iaTyping';
        chatArea.appendChild(typingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            const resposta = await fetch('/api/onimob/ia/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pergunta: pergunta,
                    pagina: chatState.pagina,
                    contexto: chatState.contexto
                })
            }).then(r => r.json());

            // Remover indicador de digitação
            document.getElementById('iaTyping')?.remove();

            // Adicionar resposta
            adicionarMensagem(resposta.resposta, 'assistant');

            // Adicionar ação recomendada se existir
            if (resposta.acao_recomendada) {
                adicionarAcaoRecomendada(resposta.acao_recomendada);
            }

            // Mostrar sugestões
            if (resposta.sugestoes) {
                mostrarSugestoes(resposta.sugestoes);
            }

            chatArea.scrollTop = chatArea.scrollHeight;
        } catch (error) {
            document.getElementById('iaTyping')?.remove();
            adicionarMensagem('❌ Erro ao conectar. Verifique sua conexão.', 'assistant');
        }
    }

    function adicionarMensagem(texto, tipo) {
        const chatArea = document.getElementById('iaChatArea');
        const msgDiv = document.createElement('div');
        msgDiv.className = `ia-message ${tipo}`;
        msgDiv.textContent = texto;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        chatState.historico.push({ tipo, texto });
    }

    function adicionarAcaoRecomendada(acao) {
        const chatArea = document.getElementById('iaChatArea');
        const banner = document.createElement('div');
        banner.className = 'ia-action-banner';
        banner.innerHTML = `
            <strong>💡 ${acao.descricao}</strong><br>
            <button onclick="executarAcao('${acao.tipo}')">${acao.botao}</button>
        `;
        chatArea.appendChild(banner);
    }

    function mostrarSugestoes(sugestoes) {
        const sugDiv = document.getElementById('iaSuggestions');
        sugDiv.innerHTML = sugestoes.slice(0, 3).map(s =>
            `<button class="ia-suggestion-btn" onclick="sugerirAcao('${s}')">${s}</button>`
        ).join('');
    }

    function sugerirAcao(acao) {
        document.getElementById('iaInput').value = `Como ${acao.toLowerCase()}?`;
        document.getElementById('iaInput').focus();
    }

    function executarAcao(tipo) {
        alert(`📋 Abrindo: ${tipo}`);
        // Integrar com ações reais depois
    }

    // Inicializar
    atualizarContextoUI();
</script>
