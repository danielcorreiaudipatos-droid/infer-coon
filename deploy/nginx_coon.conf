# ========================================================
# NGINX REVERSE PROXY & FORTIFICACAO DE SEGURANCA
# HOLDING COON SOLUCOES TECNOLOGICAS (www.coon.com.br)
# ========================================================

# Limitacao de taxa global (Anti-DDoS e Anti-Scraper)
limit_req_zone $binary_remote_addr zone=coon_limit:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coon.com.br www.coon.com.br infer.coon.com.br ad.coon.com.br growth.coon.com.br imob.coon.com.br check.coon.com.br cob.coon.com.br _;

    # Limite maximo de upload (para fotos de imoveis e laudos em alta resolucao)
    client_max_body_size 64M;

    # Otimizacao Gzip de Alta Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    # ========================================================
    # 1. BLINDAGEM DE CABECALHOS DE SEGURANCA (SECURITY HEADERS)
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # ========================================================
    # 2. BLOQUEIO DE SCANNERS, HACKERS E ROBOS MALICIOSOS
    # ========================================================
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|censys|masscan|zgrab|acunetix|nessus|nmap|dirbuster)) {
        return 403;
    }

    # ========================================================
    # 3. BLOQUEIO INVIOLAVEL DE ARQUIVOS SENSIVEIS (ZERO LEAK)
    # Impede que qualquer um baixe bancos de dados, codigo ou .env
    # ========================================================
    location ~* \.(db|sqlite|sqlite3|py|pyc|env|sh|log|bak|backup|sql|md|git|tar|gz|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloqueio de pastas e arquivos ocultos (ex: .git, .env, .cache)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ========================================================
    # 4. APLICACAO FASTAPI (REVERSE PROXY PROTEGIDO)
    # ========================================================
    location / {
        limit_req zone=coon_limit burst=35 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para processamento de regressao pesada e IA
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ========================================================
    # 5. LIMITADOR DE FORCA BRUTA EM ENDPOINTS DE AUTENTICACAO
    # ========================================================
    location ~* ^/(api/auth/|api/checkout/subscribe|api/admin/) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de arquivos estaticos (Frontend)
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
