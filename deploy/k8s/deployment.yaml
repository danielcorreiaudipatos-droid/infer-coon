apiVersion: apps/v1
kind: Deployment
metadata:
  name: onnews-api
  labels:
    app: onnews
spec:
  replicas: 3
  selector:
    matchLabels:
      app: onnews-api
  template:
    metadata:
      labels:
        app: onnews-api
    spec:
      containers:
      - name: api
        image: 123456789.dkr.ecr.us-east-1.amazonaws.com/onnews-api:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: onnews-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: onnews-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: onnews-api-service
spec:
  selector:
    app: onnews-api
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
