services:
  - type: web
    name: infer-coon
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OFFICIAL_SITE_URL
        value: https://www.coon.com.br
      - key: COON_MASTER_KEY
        value: coon2026master
